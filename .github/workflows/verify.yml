name: Verify MUSICVERSE PRO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Verify required application files
        run: test -s index.html && test -s css/style.css && test -s js/app.js && test -s manifest.webmanifest
